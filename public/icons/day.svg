<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Sky: deep at the top, hazy toward the horizon, a little sunlight from the top right. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f55cc"/>
      <stop offset="0.5" stop-color="#3b8ced"/>
      <stop offset="0.85" stop-color="#93c9f8"/>
      <stop offset="1" stop-color="#cfe8fd"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.92" cy="0.02" r="0.7">
      <stop offset="0" stop-color="#fffbe8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fffbe8" stop-opacity="0"/>
    </radialGradient>

    <!-- Cumulus: puffs with their edges broken up by noise, lit from above, blue-grey underneath. -->
    <filter id="billow" x="-20%" y="-30%" width="140%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f8fd"/>
      <stop offset="1" stop-color="#aebfd8"/>
    </linearGradient>

    <!-- The hill: yellow-green on the crest, deepening down the slope. -->
    <linearGradient id="hill" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#a6e43a"/>
      <stop offset="0.3" stop-color="#62bd1a"/>
      <stop offset="0.7" stop-color="#35900f"/>
      <stop offset="1" stop-color="#1d6608"/>
    </linearGradient>
    <!-- Grass: fine vertical streaks over it. -->
    <filter id="grass" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1 0.13" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.2  0 0 0 0 0  0 0 0 1.5 -0.55" result="streaks"/>
      <feComposite in="streaks" in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- Big soft cloud shadows drifting over the slope. -->
    <filter id="patches" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07 0.12" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.04  0 0 0 0 0.16  0 0 0 0 0.02  0 0 0 2.2 -1.05" result="shade"/>
      <feComposite in="shade" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2ff8a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#e2ff8a" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="0.6"/></filter>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <rect width="64" height="64" fill="url(#sun)"/>

    <!-- A far, faint cloud low on the left, and the main one up on the right. -->
    <g filter="url(#billow)" opacity=".55">
      <ellipse cx="9" cy="30" rx="9" ry="2.6" fill="#eef4fb"/>
      <ellipse cx="15" cy="28.6" rx="5" ry="2.6" fill="#f6f9fd"/>
    </g>
    <g filter="url(#billow)">
      <ellipse cx="44" cy="22.5" rx="14" ry="5" fill="url(#cloud)"/>
      <circle cx="39" cy="17.5" r="6" fill="url(#cloud)"/>
      <circle cx="47.5" cy="15.5" r="7" fill="url(#cloud)"/>
      <circle cx="54.5" cy="19.5" r="4.8" fill="url(#cloud)"/>
    </g>

    <!-- Far blue-violet hills in the haze, peeking over the horizon on the right. -->
    <path d="M34 52c7-4 14-5.6 21-5.2 3.6.2 6.8 1 9 1.8V64H34z" fill="#7f95c9"/>
    <path d="M34 52c7-4 14-5.6 21-5.2 3.6.2 6.8 1 9 1.8V64H34z" fill="#cfe2f7" opacity=".25"/>

    <!-- The hill: high from the left, cresting left of centre, one long slope down to the right. -->
    <g>
      <path id="h" d="M0 42.5c7.4-5.8 15.4-8.6 23.4-8.6 11 0 19.2 5.8 29 11.6 4.4 2.6 8.2 4.2 11.6 4.8V64H0z" fill="url(#hill)"/>
      <path d="M0 42.5c7.4-5.8 15.4-8.6 23.4-8.6 11 0 19.2 5.8 29 11.6 4.4 2.6 8.2 4.2 11.6 4.8V64H0z" fill="#000" filter="url(#patches)"/>
      <path d="M0 42.5c7.4-5.8 15.4-8.6 23.4-8.6 11 0 19.2 5.8 29 11.6 4.4 2.6 8.2 4.2 11.6 4.8V64H0z" fill="#000" filter="url(#grass)"/>
      <!-- Sunlight along the crest, fading down the slope. -->
      <path d="M0 42.5c7.4-5.8 15.4-8.6 23.4-8.6 11 0 19.2 5.8 29 11.6 4.4 2.6 8.2 4.2 11.6 4.8v1.6c-3.6-.6-7.6-2.2-12-4.8C41.6 41.6 34 36 23.4 36 15.4 36 7.4 38.8 0 44.4z" filter="url(#soft)" fill="url(#crest)"/>
    </g>
  </g>
</svg>
